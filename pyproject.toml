[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fpl-data"
version = "0.1.0"
description = "Fetch and store Fantasy Premier League data from public FPL endpoints"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "typer>=0.12",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "pytest-cov>=5.0",
    "python-dotenv>=1.0",
]

[project.scripts]
fpl-data = "fpl_data.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["fpl_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
